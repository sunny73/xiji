[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# 迁移文件名带时间戳，多人协作时排序稳定
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 注意：sqlalchemy.url 故意留空。
# 真实连接串由 migrations/env.py 从 app.core.config.settings 读取，
# 避免把密码写进这个会被提交到 git 的文件里。

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
