# ---------------------------------------------------------------------------
# 分红管家 API 反向代理
#
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/dividend.conf
#   sudo vim /etc/nginx/conf.d/dividend.conf      # 改域名 + 证书路径
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置：
#   1. 域名已 ICP 备案并解析到本机
#   2. 证书已签发：certbot certonly --webroot -w /var/www/certbot -d api.你的域名.com
#   3. 后端在跑：docker compose -f docker-compose.yml up -d（只监听 127.0.0.1:8000）
# ---------------------------------------------------------------------------

# 按 IP 限流。小程序用户量小，20r/s 足够；被刷时能挡住最简单的攻击。
# 真正的防护要在云厂商那一层做，这里只是兜底。
limit_req_zone $binary_remote_addr zone=dividend_api:10m rate=20r/s;

# HTTP：只做证书续期校验 + 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;          # ← 改成你的域名

    # certbot 的 webroot 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx < 1.25 用不了下面这行（那时应写成 listen 443 ssl http2;）
    http2 on;
    server_name api.example.com;          # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;   # ← 改
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;     # ← 改

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 小程序要求 HTTPS，HSTS 让后续请求强制走 https
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # 接口不返回 HTML，禁掉嗅探和框架嵌套
    add_header X-Frame-Options "DENY" always;

    # 这个 API 只收发 JSON，1MB 绰绰有余
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    access_log /var/log/nginx/dividend.access.log;
    error_log  /var/log/nginx/dividend.error.log warn;

    # --- 业务接口 ---------------------------------------------------------
    location /api/ {
        limit_req zone=dividend_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 别把上游的错误页原样透出去
        proxy_intercept_errors on;
    }

    # --- 健康检查（给外部拨测用，不记日志）-------------------------------
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8000/healthz;
    }

    # --- 其余一律拒绝 -----------------------------------------------------
    # 这个域名只用来提供 API，不托管网页。返回 404 而不是默认页，
    # 免得被人当成一个网站来扫描。
    location / {
        return 404;
    }

    # 隐藏 nginx 版本号
    server_tokens off;
}
